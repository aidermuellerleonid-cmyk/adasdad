name: APK bauen

# Läuft bei jedem Push auf main/master und kann auch manuell gestartet werden
# (Tab "Actions" -> "APK bauen" -> "Run workflow").
on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    name: Android APK bauen
    runs-on: ubuntu-latest

    steps:
      - name: Projekt auschecken
        uses: actions/checkout@v4

      - name: Java einrichten
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Flutter einrichten
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Gradle einrichten
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.14

      - name: local.properties vorbereiten
        run: |
          echo "flutter.sdk=$FLUTTER_ROOT" > android/local.properties

      - name: Gradle Wrapper erzeugen
        run: |
          cd android
          # Erzeugt gradlew/gradlew.bat + den passenden Wrapper-JAR,
          # passend zur in gradle-wrapper.properties hinterlegten Version.
          gradle wrapper --gradle-version 8.13
          chmod +x gradlew

      - name: Abhängigkeiten laden
        run: flutter pub get

      - name: APK bauen (Release)
        run: flutter build apk --release --android-skip-build-dependency-validation

      - name: APK als Download bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: lernapp-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
