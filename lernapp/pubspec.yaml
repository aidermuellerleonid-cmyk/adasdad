name: lernapp
description: KI-Lern-App für Schüler – Zusammenfassen, Mathe, Lernmodus, KI-Chat, Bildanalyse.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # State management
  provider: ^6.1.2

  # Lokale Datenbank für Verlauf, Lernzettel, Chats
  sqflite: ^2.3.3+1
  path: ^1.9.0
  path_provider: ^2.1.3

  # Bild-Auswahl & Kamera
  image_picker: ^1.1.2

  # OCR auf dem Gerät (offline, kostenlos)
  google_mlkit_text_recognition: ^0.13.0

  # KI-Anbindung (HTTP-Requests an Gemini/OpenAI/Claude)
  http: ^1.2.1

  # Konfiguration (API-Key lokal speichern)
  shared_preferences: ^2.2.3

  # UUIDs für Datensätze
  uuid: ^4.4.0

  # Datum/Zeit-Formatierung
  intl: ^0.19.0

  # Datei-Freigabe / Export
  share_plus: ^9.0.0

  # Mehrere Dateien gleichzeitig verarbeiten
  file_picker: ^8.0.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icon/
